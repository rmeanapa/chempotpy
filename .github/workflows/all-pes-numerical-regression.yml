name: All PES numerical regression

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: all-pes-numerical-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    numerical-regression:
        name: Compare all PES values with the base revision
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the tested revision
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up current Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Install the compiler and Python runtime dependency
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes gfortran
                  python -m pip install --upgrade pip numpy

            - name: Capture the base revision on this runner
              id: baseline
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                  PUSH_FORCED: ${{ github.event.forced }}
              run: |
                  set -euo pipefail
                  if [[ "$EVENT_NAME" == "pull_request" ]]; then
                      base_sha="$PR_BASE_SHA"
                  elif [[ "$PUSH_FORCED" != "true" ]] && \
                       [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && \
                       [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                      base_sha="$PUSH_BEFORE_SHA"
                  else
                      base_sha="$(git rev-parse HEAD^)"
                  fi
                  if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                      base_sha="$(git rev-parse HEAD^)"
                  fi
                  fixture="${RUNNER_TEMP}/all_surface_references.base.json"
                  base_checkout="${RUNNER_TEMP}/chempotpy-base"
                  git worktree add --detach "$base_checkout" "$base_sha"
                  trap 'git worktree remove --force "$base_checkout" >/dev/null 2>&1 || true' EXIT
                  (
                      cd "$base_checkout"
                      python scripts/capture_library_references.py \
                          --all \
                          --jobs 4 \
                          --output "$fixture"
                  )
                  echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
                  echo "fixture=$fixture" >> "$GITHUB_OUTPUT"

            - name: Compile and compare every PES
              run: |
                  set +e
                  output="${RUNNER_TEMP}/numerical-regression.txt"
                  python scripts/check_numerical_regression.py \
                      --baseline "${{ steps.baseline.outputs.fixture }}" \
                      --jobs 4 2>&1 | tee "$output"
                  status=${PIPESTATUS[0]}
                  {
                      echo "## All PES numerical regression"
                      echo '```text'
                      tail -200 "$output"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit "$status"

            - name: Report the protected baseline
              if: always()
              run: |
                  echo "Numerical baseline: ${{ steps.baseline.outputs.sha }}"

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
    <title id="title">ChemPotPy social preview</title>
    <desc id="description">ChemPotPy potential energy surface library with 404 surfaces across 100 systems.</desc>
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#07182c"/>
            <stop offset="0.55" stop-color="#0c3150"/>
            <stop offset="1" stop-color="#07575b"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#54e6d0" stop-opacity="0.38"/>
            <stop offset="1" stop-color="#54e6d0" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00101d" flood-opacity="0.45"/>
        </filter>
    </defs>
    <rect width="1280" height="640" fill="url(#background)"/>
    <circle cx="1090" cy="130" r="360" fill="url(#glow)"/>
    <circle cx="170" cy="620" r="300" fill="url(#glow)" opacity="0.55"/>
    <g opacity="0.24" stroke="#a8fff0" stroke-width="3">
        <path d="M880 96 L1010 165 L1135 98 L1212 210 L1100 306 L955 278 L880 96" fill="none"/>
        <path d="M1010 165 L1100 306 M1135 98 L955 278"/>
        <circle cx="880" cy="96" r="13" fill="#65e8d4"/>
        <circle cx="1010" cy="165" r="20" fill="#65e8d4"/>
        <circle cx="1135" cy="98" r="12" fill="#65e8d4"/>
        <circle cx="1212" cy="210" r="17" fill="#65e8d4"/>
        <circle cx="1100" cy="306" r="23" fill="#65e8d4"/>
        <circle cx="955" cy="278" r="15" fill="#65e8d4"/>
    </g>
    <g filter="url(#shadow)">
        <rect x="72" y="68" width="1136" height="504" rx="32" fill="#071a2b" fill-opacity="0.76" stroke="#6ce5d2" stroke-opacity="0.35"/>
    </g>
    <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
        <text x="128" y="180" fill="#79f0dc" font-size="26" font-weight="700" letter-spacing="5">OPEN MOLECULAR SCIENCE</text>
        <text x="122" y="302" fill="#ffffff" font-size="104" font-weight="750" letter-spacing="-4">ChemPotPy</text>
        <text x="128" y="365" fill="#c8dce8" font-size="34" font-weight="400">Potential energy surfaces, ready to use</text>
        <g transform="translate(128 415)">
            <rect width="250" height="74" rx="18" fill="#0e3c59" stroke="#3e7893"/>
            <text x="125" y="31" fill="#ffffff" font-size="29" font-weight="750" text-anchor="middle">404 surfaces</text>
            <text x="125" y="57" fill="#a9c9d9" font-size="18" text-anchor="middle">validated catalog</text>
        </g>
        <g transform="translate(398 415)">
            <rect width="250" height="74" rx="18" fill="#0e3c59" stroke="#3e7893"/>
            <text x="125" y="31" fill="#ffffff" font-size="29" font-weight="750" text-anchor="middle">100 systems</text>
            <text x="125" y="57" fill="#a9c9d9" font-size="18" text-anchor="middle">Python + Fortran</text>
        </g>
        <g transform="translate(668 415)">
            <rect width="412" height="74" rx="18" fill="#10a89b"/>
            <text x="206" y="31" fill="#ffffff" font-size="29" font-weight="750" text-anchor="middle">Submit your PES</text>
            <text x="206" y="57" fill="#e7fffb" font-size="18" text-anchor="middle">no Git or modernization required</text>
        </g>
        <text x="128" y="538" fill="#83a9bb" font-size="21">github.com/rmeanapa/chempotpy</text>
    </g>
</svg>
